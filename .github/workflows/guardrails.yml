# Guardrails (installed 2026-09-13 by /refactor-python:guardrails): fails the build
# when a change breaks the file-size budget, ruff complexity rules, or import contracts.
name: guardrails
on: [push, pull_request]

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.7 import-linter
      - name: ruff (lint + complexity)
        run: ruff check scripts tests system/fr223
      - name: file size budget
        run: git ls-files -z '*.py' | xargs -0 python3 scripts/check_file_length.py --baseline .refactor-baseline.json
      - name: import boundaries
        run: PYTHONPATH=scripts:scripts/forge lint-imports
