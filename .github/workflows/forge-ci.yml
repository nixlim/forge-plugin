name: forge-ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  gates:
    name: forge gates (tests, conformance, evals, drift)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Gate 1 — committed gate-1 policy cell (sharded full discovery)
        run: |
          # Run the exact committed gate1-test-command cell through the repository's own
          # FR-149 runner (forge_cli.runtime.run_bounded: isolated process group, kill on
          # timeout, 65,536-byte output cap, fixed 1200 s bound) with `forge` as $0, so CI
          # exercises the same sharded discovery the commit, merge, and drift gates run.
          python3 - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts/forge")
          from forge_cli.policy import parse_policy
          from forge_cli.runtime import run_bounded

          head = subprocess.run(["git", "rev-parse", "HEAD"], capture_output=True, text=True, check=True).stdout.strip()
          raw = subprocess.run(["git", "show", f"{head}:forge-project.md"], capture_output=True, check=True).stdout
          cell = parse_policy(head, raw).gate1
          result = run_bounded(["bash", "-c", cell, "forge"], cwd=Path.cwd(), timeout=1200)
          sys.stdout.buffer.write(result.output)
          sys.stdout.flush()
          if result.timed_out:
              print("gate-1: cell exceeded the 1200-second fail-closed timeout", file=sys.stderr)
              raise SystemExit(2)
          if result.output_limit:
              print("gate-1: cell exceeded the 65,536-byte output cap", file=sys.stderr)
              raise SystemExit(2)
          raise SystemExit(result.returncode)
          PY

      - name: Routing and executable-inventory conformance
        run: python3 -m unittest tests.test_repo_conformance

      - name: STRICT evals
        run: STRICT=1 bash scripts/forge/run-evals.sh

      - name: Drift check (mechanical pass, reduced-signal CI mode)
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
        run: |
          set -o pipefail
          # errexit-safe capture: GitHub's default shell is `bash -e {0}`, so a
          # bare nonzero pipeline would abort the step before any status check.
          # The summary is written outside the checkout: drift-check's
          # worktree-clean check runs `git status --untracked-files=all`, so a
          # tee target inside the worktree would dirty the tree it is auditing.
          bash scripts/forge/drift-check.sh | tee "$RUNNER_TEMP/drift-summary.json" && status=0 || status=$?
          # exit 2 is a drift-check failure; 0/1 (clean/findings) both pass CI —
          # findings are the drift skill's concern, not a PR gate.
          if [ "$status" -eq 2 ]; then exit 2; fi
          exit 0

      - name: Upload drift summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drift-summary
          path: ${{ runner.temp }}/drift-summary.json
          if-no-files-found: ignore
