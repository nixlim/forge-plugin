# Import boundaries. Run: PYTHONPATH=scripts:scripts/forge lint-imports
# (the two root packages are loaded by path, not installed; see tests/_cli_loader.py).
[tool.importlinter]
root_packages = ["forge_cli", "codex_orchestrator"]
include_external_packages = false

# forge_cli layering, top to bottom, as documented in docs/specs/forge-plugin-spec.md
# section 5 (app -> engine -> chain_core -> fresh_evals -> leaf modules).
[[tool.importlinter.contracts]]
name = "forge_cli layers"
type = "layers"
layers = [
    "forge_cli.app",
    "forge_cli.engine",
    "forge_cli.chain_core",
    "forge_cli.fresh_evals",
    "forge_cli.candidate | forge_cli.runtime | forge_cli.policy | forge_cli.envelope",
]
# Pre-existing cycle (2026-09-13): runtime.py:74 lazily imports codex_orchestrator,
# whose builders/journal lazily import forge_cli.candidate/fresh_evals/policy/
# chain_core, which closes an indirect cycle back into the upper layers. Ignored so
# the contract checks direct layering. TODO: remove once that seam is untangled.
ignore_imports = [
    "forge_cli.runtime -> codex_orchestrator.batch",
    "forge_cli.runtime -> codex_orchestrator.builders",
    "forge_cli.runtime -> codex_orchestrator.journal",
]

# codex_orchestrator must not depend on forge_cli at module import time. The four
# function-level imports below are pre-existing lazy cross-links (2026-09-13); they
# are ignored here so the contract tracks today's shape. TODO: remove each ignore
# once the cross-link is gone (runtime.py:74 is the mirror-image lazy import from
# forge_cli into codex_orchestrator; it is not covered by this contract).
[[tool.importlinter.contracts]]
name = "codex_orchestrator does not import forge_cli"
type = "forbidden"
source_modules = ["codex_orchestrator"]
forbidden_modules = ["forge_cli"]
ignore_imports = [
    "codex_orchestrator.builders -> forge_cli.candidate",
    "codex_orchestrator.builders -> forge_cli.fresh_evals",
    "codex_orchestrator.builders -> forge_cli.policy",
    "codex_orchestrator.journal -> forge_cli.chain_core",
]
