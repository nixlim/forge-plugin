# Dev-tooling config only; NOT a package/build manifest - plugin runs via bare python3 <path>.

[project]
name = "codex-orchestrator"
version = "0.6.12"
description = "Coordinate reusable monitored OpenAI Codex agents from Claude Code."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "alexzh3" }]

# ---------------------------------------------------------------------------
# Guardrails (installed 2026-09-13 by /refactor-python:guardrails).
# Thresholds are deliberate; raise one only with a comment here explaining why.
# Companion checks: scripts/check_file_length.py (500 code lines per file, with
# .refactor-baseline.json grandfathering) and [tool.importlinter] below.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".worktrees", ".codex-orchestrator", "upstream", ".forge", "tests/replay"]

[tool.ruff.lint]
# PLR0904 and PLR1702 are preview rules; explicit-preview-rules keeps every
# other preview rule off so the prefixes (E, F, ...) select only stable rules.
preview = true
explicit-preview-rules = true
select = ["E", "F", "I", "B", "UP", "C90", "PLR0904", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR1702"]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50
max-args = 6
max-branches = 12
max-returns = 6
max-public-methods = 20
max-nested-blocks = 4

