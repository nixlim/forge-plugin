# Import boundaries. Run: PYTHONPATH=scripts:scripts/forge lint-imports
# (the two root packages are loaded by path, not installed; see tests/_cli_loader.py).
[tool.importlinter]
root_packages = ["forge_cli", "codex_orchestrator"]
include_external_packages = false
# TYPE_CHECKING-guarded imports are annotations, not runtime edges (engine/_command_lock
# and engine/_finalize name Engine that way; import-linter 2.15 takes this as a session option).
exclude_type_checking_imports = true

# forge_cli layering, top to bottom, as documented in docs/specs/forge-plugin-spec.md
# section 5 (app -> engine -> chain_core -> fresh_evals -> leaf modules).
[[tool.importlinter.contracts]]
name = "forge_cli layers"
type = "layers"
layers = [
    "forge_cli.app",
    "forge_cli.engine",
    "forge_cli.chain_core",
    "forge_cli.fresh_evals",
    "forge_cli.candidate | forge_cli.runtime | forge_cli.policy | forge_cli.envelope",
]
# Pre-existing cycle (2026-09-13): runtime.py:74 lazily imports codex_orchestrator,
# whose builders/journal lazily import forge_cli.candidate/fresh_evals/policy/
# chain_core, which closes an indirect cycle back into the upper layers. Ignored so
# the contract checks direct layering. TODO: remove once that seam is untangled.
ignore_imports = [
    "forge_cli.runtime -> codex_orchestrator.batch",
    "forge_cli.runtime -> codex_orchestrator.builders",
    "forge_cli.runtime -> codex_orchestrator.journal",
]

# forge_cli.chain_core intra-package layering, top to bottom, in the wave order of
# .refactor/plan-chain_core.md (wave 16 at the top, wave 0's _state at the bottom;
# `|` marks modules of one wave that do not import each other). _fenced_process
# imports _common_lock, so the two wave-16 modules are sequential layers. The split
# introduced no function-local imports, so no intra-package ignore is needed; the
# three ignores below mirror the "forge_cli layers" contract exactly (the
# pre-existing runtime.py:74 -> codex_orchestrator -> forge_cli.chain_core lazy
# cross-link closes an indirect cycle into every submodule). TODO: remove with theirs.
[[tool.importlinter.contracts]]
name = "forge_cli.chain_core layers"
type = "layers"
containers = ["forge_cli.chain_core"]
layers = [
    "_fenced_process",
    "_common_lock",
    "_merge_chain",
    "_lock_recovery",
    "_lock_owner | _lock_reservation",
    "_commit_chain",
    "_activation_outbox | _chain_batch_authorize",
    "_activation | _chain_batch_carrier | _storage",
    "_ingest_merge | _merge_replay",
    "_merge_transition",
    "_merge_recovery_proof",
    "_merge_recovery_lifecycle",
    "_merge_epoch",
    "_merge_candidate_observation",
    "_merge_candidate_observation_steps | _merge_cleanup_result | _merge_release | _merge_scope",
    "_lock_record_io | _merge_cleanup_history | _merge_cleanup_observation | _merge_scope_binding | _remote_observation",
    "_bootstrap_observation | _candidate_v2 | _chain_state | _fenced_child | _ingest_capture | _ingest_currency | _lock_record_validators | _merge_cleanup_intent | _merge_events | _merge_plan | _merge_rebase | _merge_state_shape | _receipt_snapshot | _repository",
    "_core",
    "_controls",
    "_state",
]
ignore_imports = [
    "forge_cli.runtime -> codex_orchestrator.batch",
    "forge_cli.runtime -> codex_orchestrator.builders",
    "forge_cli.runtime -> codex_orchestrator.journal",
]

# forge_cli.engine intra-package layering, top to bottom, in the wave order of
# .refactor/plan-engine.md (wave 5's _engine at the top, wave 0's _state at the bottom;
# `|` marks modules of one wave that do not import each other). _command_lock and
# _finalize name Engine only under TYPE_CHECKING (excluded by the session option above); the three ignores
# mirror the "forge_cli layers" contract exactly. TODO: remove with theirs.
[[tool.importlinter.contracts]]
name = "forge_cli.engine layers"
type = "layers"
containers = ["forge_cli.engine"]
layers = [
    "_engine",
    "_finalize | _merge_candidate_generation",
    "_approval | _candidate_ops | _fresh_eval_evidence | _gate_checks | _merge_bootstrap_child | _merge_candidate_observation",
    "_archive | _classification | _cli_options | _command_lock | _fresh_eval | _journal | _merge_bootstrap_result | _merge_candidate | _merge_claim | _merge_conflict | _merge_epoch | _merge_rebase_integrated | _merge_scope_binding | _merge_scope_derive | _merge_worktree | _parser | _review_transport",
    "_core",
    "_state",
]
ignore_imports = [
    "forge_cli.runtime -> codex_orchestrator.batch",
    "forge_cli.runtime -> codex_orchestrator.builders",
    "forge_cli.runtime -> codex_orchestrator.journal",
]

[[tool.importlinter.contracts]]
# forge_cli.app split (bead forge-plugin-hcuo): wave order of .refactor/plan-app.md; the same
# lazy runtime -> codex_orchestrator cycle as the engine contract is ignored.
name = "forge_cli.app layers"
type = "layers"
containers = ["forge_cli.app"]
layers = [
    "_dispatch",
    "_merge_engine",
    "_admission | _candidate_observation | _mutation_journal",
]
ignore_imports = [
    "forge_cli.runtime -> codex_orchestrator.batch",
    "forge_cli.runtime -> codex_orchestrator.builders",
    "forge_cli.runtime -> codex_orchestrator.journal",
]

# codex_orchestrator must not depend on forge_cli at module import time. The four
# function-level imports below are pre-existing lazy cross-links (2026-09-13); they
# are ignored here so the contract tracks today's shape. TODO: remove each ignore
# once the cross-link is gone (runtime.py:74 is the mirror-image lazy import from
# forge_cli into codex_orchestrator; it is not covered by this contract).
[[tool.importlinter.contracts]]
name = "codex_orchestrator does not import forge_cli"
type = "forbidden"
source_modules = ["codex_orchestrator"]
forbidden_modules = ["forge_cli"]
ignore_imports = [
    "codex_orchestrator.builders -> forge_cli.candidate",
    "codex_orchestrator.builders -> forge_cli.fresh_evals",
    "codex_orchestrator.builders -> forge_cli.policy",
    "codex_orchestrator.journal -> forge_cli.chain_core",
]
